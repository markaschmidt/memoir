services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: mark-schmidt-portfolio:latest
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      STEAM_WIDGETS_URL: ${STEAM_WIDGETS_URL:-http://host.docker.internal:3002}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
